name: build-plugin

on:
  push:
    branches: ['arena/**']
    paths: ['plugin/**', '.github/workflows/build-plugin.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilare plugin
        run: |
          set -o pipefail
          mvn -f plugin/pom.xml package 2>&1 | tee plugin/build-output.txt

      - name: Publică erorile în repo (la eșec)
        if: failure()
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          mkdir -p plugin/release
          cp plugin/build-output.txt plugin/release/build-errors.txt 2>/dev/null || mvn -f plugin/pom.xml package > plugin/release/build-errors.txt 2>&1 || true
          git add plugin/release/build-errors.txt
          git commit -m "build: erori de compilare [skip ci]" || echo "nimic"
          for i in 1 2 3 4; do
            git pull --rebase -q origin arena/01a106d2-mod-convertor-proiect && git push -q origin HEAD:arena/01a106d2-mod-convertor-proiect && echo "push OK" && break
            echo "retry push $i"; sleep 10
          done

      - name: Verificare jar
        run: |
          ls -la plugin/target/OffroaderPlugin.jar
          unzip -l plugin/target/OffroaderPlugin.jar | head -20

      - name: Test pe server Paper 1.21.4 real
        run: |
          set -o pipefail
          {
            set -x
            URL=$(curl -sfL "https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds/latest" | jq -r '.downloads["server:default"].url')
            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "fill v3 indisponibil, încerc v2..."
              BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds | jq -r '.builds[-1].build')
              NAME=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/$BUILD | jq -r '.downloads.application.name')
              URL="https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/$BUILD/downloads/$NAME"
            fi
            echo "Descarc Paper de la: $URL"
            curl -sfL -o paper.jar "$URL"
            ls -la paper.jar
            mkdir -p server/plugins
            mv paper.jar server/paper.jar
            cd server
            echo "eula=true" > eula.txt
            printf "online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nspawn-monsters=false\n" > server.properties
            cp ../plugin/target/OffroaderPlugin.jar plugins/
            timeout 150 java -Xmx2G -jar paper.jar nogui > run.log 2>&1 || true
            tail -40 run.log
          } 2>&1 | tee smoke-diag.txt
          grep -qE "OffroaderPlugin.*activ" server/run.log && echo "=== SMOKE TEST OK: pluginul s-a încărcat pe server real ===" || { echo "=== SMOKE TEST FAILED ==="; exit 1; }

      - name: Publică erorile în repo (la eșec)
        if: failure()
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          mkdir -p plugin/release
          { [ -f plugin/build-output.txt ] && cp plugin/build-output.txt plugin/release/build-errors.txt
            [ -f smoke-diag.txt ] && cp smoke-diag.txt plugin/release/smoke-diag.txt
            if [ -f server/run.log ]; then tail -100 server/run.log > plugin/release/server-test.log; else echo "server/run.log lipsește" > plugin/release/server-test.log; fi
          } || true
          git add plugin/release/
          git commit -m "build: log-uri diagnostic CI [skip ci]" || echo "nimic de comis"
          git push || echo "push eșuat"

      - name: Commit jar în repo
        run: |
          mkdir -p plugin/release
          cp plugin/target/OffroaderPlugin.jar plugin/release/OffroaderPlugin.jar
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git rm -f --cached plugin/release/build-errors.txt 2>/dev/null || true
          git add plugin/release/OffroaderPlugin.jar
          git commit -m "build: OffroaderPlugin.jar (CI) [skip ci]" || echo "nimic nou de comis"
          git push
