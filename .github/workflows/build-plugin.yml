name: build-plugin

on:
  push:
    branches: ['arena/**']
    paths: ['plugin/**', '.github/workflows/build-plugin.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilare plugin
        run: mvn -q -f plugin/pom.xml package

      - name: Verificare jar
        run: |
          ls -la plugin/target/OffroaderPlugin.jar
          unzip -l plugin/target/OffroaderPlugin.jar | head -20

      - name: Test pe server Paper 1.21.4 real
        run: |
          set -e
          BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds | jq -r '.builds[-1].build')
          NAME=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/$BUILD | jq -r '.downloads.application.name')
          echo "Paper 1.21.4 build $BUILD ($NAME)"
          curl -s -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/$BUILD/downloads/$NAME"
          mkdir -p server/plugins
          mv paper.jar server/paper.jar
          cd server
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nspawn-monsters=false\n" > server.properties
          cp ../plugin/target/OffroaderPlugin.jar plugins/
          timeout 150 java -Xmx2G -jar paper.jar nogui > run.log 2>&1 || true
          tail -30 run.log
          grep -q "OffroaderPlugin activ" run.log && echo "=== SMOKE TEST OK: pluginul s-a încărcat pe server real ===" || { echo "=== SMOKE TEST FAILED ==="; exit 1; }

      - name: Commit jar în repo
        run: |
          mkdir -p plugin/release
          cp plugin/target/OffroaderPlugin.jar plugin/release/OffroaderPlugin.jar
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add plugin/release/OffroaderPlugin.jar
          git commit -m "build: OffroaderPlugin.jar (CI) [skip ci]" || echo "nimic nou de comis"
          git push
