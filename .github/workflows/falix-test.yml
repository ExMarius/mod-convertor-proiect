name: falix-test

on:
  push:
    branches: ['arena/**']
    paths: ['deploy/falix-test.txt']

permissions:
  contents: write

jobs:
  falix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sondaj API Falix
        env:
          PTERO_TOKEN: ${{ secrets.PTERO_TOKEN }}
        run: |
          {
            echo "=== $(date -u) sondaj API Falix ==="
            FALIX_TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 -base64 -k "$PTERO_TOKEN" -in deploy/falix_token.enc)
            FALIX_TOKEN="$FALIX_TOKEN" python3 deploy/falix_probe5.py
          } 2>&1 | tee deploy-report/falix.txt

      - name: Publică raportul
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add deploy-report/falix.txt || true
          git commit -m "falix: raport sondaj API [skip ci]" || echo "nimic"
          for i in 1 2 3 4; do
            if git pull --rebase -q origin ${GITHUB_REF#refs/heads/} 2>/dev/null && git push; then
              echo "raport publicat"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "retry $i..."; sleep 8
          done
          # ultimă șansă: reset soft pe origin și re-commit
          git fetch -q origin
          git reset --soft origin/${GITHUB_REF#refs/heads/}
          git add deploy-report/falix.txt
          git commit -m "falix: raport sondaj API [skip ci]" || true
          git push || echo "push eșuat definitiv"
