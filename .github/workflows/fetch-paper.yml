name: fetch-paper

on:
  push:
    branches: ['arena/**']
    paths: ['deploy/fetch-paper.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descarcă Paper 1.21.4 și comite-l în repo
        run: |
          set -e
          URL=$(curl -sfL "https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds/latest" | jq -r '.downloads["server:default"].url')
          echo "Paper: $URL"
          mkdir -p server
          curl -sfL -o server/paper-1.21.4.jar "$URL"
          ls -la server/paper-1.21.4.jar
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -f server/paper-1.21.4.jar
          git commit -m "server: paper-1.21.4.jar [skip ci]" || echo "deja prezent"
          git pull --rebase -q origin ${GITHUB_REF#refs/heads/} 2>/dev/null || true
          git push
